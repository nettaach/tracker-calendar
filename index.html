<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bonus tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--fg:#2b2b2b;--line:#8a8a88;--dim:#74746f;--pink:#4a4a48;--sel:#dcdcd7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d1c;--fg:#e4e4e0;--line:#6d6d6a;--dim:#9a9a95;--pink:#cfcfc9;--sel:#2e2e2c}}
html,body{margin:0;overflow-x:hidden;max-width:100%}body{background:var(--bg);color:var(--fg);font-family:'IM Fell English',Georgia,serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 12px 40px}
.ph{position:relative;aspect-ratio:3.1/1;background:#3a363a;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.3)}
.ph button{position:absolute;right:8px;bottom:8px;background:rgba(30,26,30,.85);color:#ddd;border:none;font:italic 15px 'IM Fell English',serif;padding:8px 12px;cursor:pointer}
.tabs{min-height:52px;display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font:italic 19px 'IM Fell English',serif;cursor:pointer}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:var(--bg)}
.head{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}
.title{white-space:nowrap;flex:none;font-family:'Herr Von Muellerhoff','Snell Roundhand',cursive;font-size:60px;line-height:1;color:var(--fg)}
.sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font:italic 22px 'IM Fell English',serif;color:var(--dim);border-bottom:1px dotted var(--line);padding-bottom:4px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{font-size:13px;letter-spacing:.08em;color:var(--dim);font-weight:400;padding:8px 0;border:1px solid var(--line)}
td{border:1px solid var(--line);height:72px;padding:0;cursor:pointer;overflow:hidden;vertical-align:top}.cell{height:72px;overflow:hidden;padding:3px;box-sizing:border-box}
td.sel{outline:2px solid var(--pink);outline-offset:-2px;background:var(--sel)}
td.sel .n{color:var(--pink);font-weight:bold}
td.empty{cursor:default}
.n{font-size:12px;text-align:right;color:var(--dim);padding-right:3px}
.c{font-size:15px;line-height:1.1;word-break:break-all;max-height:46px;overflow:hidden}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:22px 4px 8px}
.item{display:flex;align-items:center;gap:8px}
.em{font-size:28px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:8px}
.em:active{background:var(--sel)}
.item input{flex:1;min-width:0;background:none;border:none;border-bottom:1px solid var(--line);color:var(--fg);font:17px 'IM Fell English',serif;padding:4px 2px;outline:none}
.item input:focus{border-color:var(--pink)}
.hint{font:italic 20px 'IM Fell English',serif;color:var(--dim);margin:18px 4px 0}
.bar{display:flex;justify-content:space-between;gap:12px;margin:10px 4px 0}.clear{background:none;border:none;color:var(--dim);font:italic 15px 'IM Fell English',serif;text-decoration:underline;cursor:pointer;padding:6px 0}
@media(max-width:520px){.title{font-size:52px}.legend{grid-template-columns:1fr 1fr;gap:10px 14px}}
</style></head><body><div class="wrap">
<div class="ph"><img id="ban" alt=""><button id="chg">сменить фото</button><input type="file" id="file" accept="image/*" hidden></div>
<div class="tabs" id="tabs"></div>
<div class="head"><span class="title" id="ttl"></span><span class="sub">bonus tracker</span></div>
<table><thead><tr id="wd"></tr></thead><tbody id="tb"></tbody></table>
<div class="bar"><button class="clear" id="bk">⌫ стереть последний смайлик</button><button class="clear" id="cl">очистить день</button></div>
<div class="legend" id="lg"></div>
<div class="hint">Нажми на день, потом на смайлик.</div>

var EM=['🦴','🕸️','🪾','🪽','🦌','🤍','🦷','🩰','🥛','🪷','🗝️'];
var SH=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],PH={};
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD=['MON','TUE','WED','THU','FRI','SAT','SUN'];
var START=new Date(2026,10,1),idx=0,sel=null,S={};
try{S=JSON.parse(localStorage.getItem('bt')||'{}')}catch(e){}
function save(){try{localStorage.setItem('bt',JSON.stringify(S))}catch(e){}}
function mk(){var d=new Date(2026,10+idx,1);return d.getFullYear()+'-'+(d.getMonth()+1)}
function get(k){return S[k]||(S[k]={c:{},l:{}})}
document.getElementById('wd').innerHTML=WD.map(function(w){return'<th>'+w+'</th>'}).join('');
function render(){
  var d=new Date(2026,10+idx,1),k=mk(),st=get(k);sel=null;
  document.getElementById('ban').src=st.photo||IMGS[idx];
  var tb=document.getElementById('tabs');if(!tb.children.length)tb.innerHTML=Array.from({length:12},function(_,i){var m=new Date(2026,10+i,1);return'<button data-i="'+i+'">'+SH[m.getMonth()]+'</button>'}).join('');Array.prototype.forEach.call(tb.children,function(b,i){b.classList.toggle('on',i==idx)});
  var on=tb.children[idx];if(on)tb.scrollLeft=on.offsetLeft-(tb.clientWidth-on.offsetWidth)/2;
  document.getElementById('ttl').textContent=MN[d.getMonth()];
  var first=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),h='',n=1;
  for(var r=0;r<6;r++){h+='<tr>';
    for(var c=0;c<7;c++){
      if((r==0&&c<first)||n>days){h+='<td class="empty"><div class="cell"></div></td>'}
      else{h+='<td data-d="'+n+'"><div class="cell"><div class="n">'+(n<10?'0':'')+n+'</div><div class="c">'+(st.c[n]||'')+'</div></div></td>';n++}
    }h+='</tr>'}
  document.getElementById('tb').innerHTML=h;
  var now=new Date();if(now.getFullYear()==d.getFullYear()&&now.getMonth()==d.getMonth()){sel=document.querySelector('td[data-d="'+now.getDate()+'"]');if(sel)sel.classList.add('sel')}
  document.getElementById('lg').innerHTML=EM.map(function(e,i){return'<div class="item"><button class="em" data-i="'+i+'">'+e+'</button><input data-i="'+i+'" value="'+(st.l[i]||'').replace(/"/g,'&quot;')+'"></div>'}).join('');
}
document.getElementById('tb').addEventListener('click',function(ev){
  var td=ev.target.closest('td[data-d]');if(!td)return;
  var p=this.querySelector('.sel');if(p)p.classList.remove('sel');
  td.classList.add('sel');sel=td;
});
document.getElementById('lg').addEventListener('click',function(ev){
  var b=ev.target.closest('.em');if(!b)return;
  if(!sel){alert('Сначала выбери день в календаре');return}
  var d=sel.dataset.d,st=get(mk());
  st.c[d]=(st.c[d]||'')+EM[b.dataset.i];
  sel.querySelector('.c').textContent=st.c[d];save();
});
document.getElementById('lg').addEventListener('input',function(ev){
  if(ev.target.tagName!=='INPUT')return;
  get(mk()).l[ev.target.dataset.i]=ev.target.value;save();
});
document.getElementById('bk').onclick=function(){
  if(!sel)return;var d=sel.dataset.d,st=get(mk()),s=st.c[d]||'';if(!s)return;
  var a=window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s),function(x){return x.segment}):Array.from(s);
  a.pop();st.c[d]=a.join('');if(!st.c[d])delete st.c[d];
  sel.querySelector('.c').textContent=st.c[d]||'';save();
};
document.getElementById('cl').onclick=function(){
  if(!sel)return;var d=sel.dataset.d;delete get(mk()).c[d];sel.querySelector('.c').textContent='';save();
};
document.getElementById('tabs').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;idx=+b.dataset.i;render()});
document.getElementById('chg').onclick=function(){document.getElementById('file').click()};
document.getElementById('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var w=Math.min(900,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');
    c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    var u=c.toDataURL('image/jpeg',0.75);get(mk()).photo=u;document.getElementById('ban').src=u;save();
  };im.src=r.result};r.readAsDataURL(f);e.target.value='';
};
render();
</script></body></html>
